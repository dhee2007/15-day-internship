<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie Haven - Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="site-header">

        <nav class="navbar">

            <div class="LOGO">
                FOODIE HAVEN
            </div>

            <ul class="links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="menu.html">Menu</a>
                </li>

                <li>
                    <a href="cart.html">Cart 🛒</a>
                </li>

            </ul>

            <div class="emoji">

                <button id="theme-toggle">🌙</button>

            </div>

        </nav>

    </header>


    <!-- ================= CHECKOUT PAGE ================= -->

    <main class="checkout-page">

        <h1>Checkout</h1>

        <p>Complete your order below 🍽️</p>


        <div class="checkout-container">

            <form id="checkout-form">

                <!-- DELIVERY DETAILS -->

                <h2>Delivery Details</h2>

                <input
                    type="text"
                    id="customer-name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="tel"
                    id="customer-phone"
                    placeholder="Phone Number"
                    required
                >

                <textarea
                    id="customer-address"
                    placeholder="Delivery Address"
                    required
                ></textarea>


                <!-- PAYMENT -->

                <h2>Payment</h2>

                <select id="payment-method" required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="upi">
                        UPI
                    </option>

                    <option value="card">
                        Credit / Debit Card
                    </option>

                    <option value="cod">
                        Cash on Delivery
                    </option>

                </select>


                <!-- PAYMENT BUTTON -->

                <button
                    type="submit"
                    id="payment-btn"
                >
                    Pay & Place Order
                </button>


                <!-- SUCCESS / ERROR MESSAGE -->

                <p id="payment-message"></p>

            </form>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
