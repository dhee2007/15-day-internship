<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVA SCRIPT</title>
</head>

<body>
    <script>
        //method1
        function greet(name) {
            return "Hello " + name;
        }
        console.log(greet("Alex"));

        //method2
        let greet1 = function (name) {//using variable 'let'
            return `Hello ${name}`;
        }
        console.log(greet1("Alex"));

        //method3>>arrow function
        let add = (a,b) => a + b;
        console.log(add(2,3));

        //method4
        let sum = function (a,b) {//funtion(parameter),sum-funtion name
            return a + b;
        }
        console.log(sum(5,5));

        //method5
        function greetuser(name = "Alex") {
            return `welcome ${name}`;
        }
        console.log(greetuser());
        console.log(greetuser("John"));

    </script>
    <!--arrow function-if only one return value,it can be placed next to arrow without return and curly braces-->
</body>

</html>
